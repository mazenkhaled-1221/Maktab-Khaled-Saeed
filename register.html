<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="shortcut icon" href="favicon.ico" type="WhatsApp Image 2025-11-01 at 20.54.55.jpeg">
<title>تسجيل حساب</title>

<style>
body {
    font-family: "Tajawal", sans-serif;
    direction: rtl;
    background-image: url("bg.jpg.jpeg"); /* خلفية الموقع */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.form-container {
    background: rgba(255, 255, 255, 0.92);
    padding: 25px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    text-align: center;
}

select, input {
    width: 95%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

.button {
    width: 100%;
    padding: 12px;
    background: #0A3D62;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.button:hover {
    opacity: 0.9;
}
.hidden {
    display:none;
}
</style>
</head>

<body>
<div class="form-container">
    <h2>إنشاء حساب</h2>

    <select id="userType">
        <option value="client">عميل</option>
        <option value="owner">صاحب المكتب</option>
    </select>

    <input type="text" placeholder="اكتب اسمك" id="nameField" />
    <input type="email" placeholder="example@gmail.com" id="emailField" />
    <input type="text" placeholder="01XXXXXXXXX" id="phoneField" />
    <input type="password" placeholder="كلمة السر" id="passwordField" />

    <button class="button">تسجيل</button>
</div>

<script>
/* عناصر */
const userTypeEl = document.getElementById("userType");
const nameField = document.getElementById("nameField");
const emailField = document.getElementById("emailField");
const phoneField = document.getElementById("phoneField");
const passwordField = document.getElementById("passwordField");
const submitBtn = document.querySelector(".button");

/* لو اختار المستخدم صاحب المكتب: نظهر بس الباسورد
   ولو اختار عميل: نبين كل الحقول (ضمن سلوك بسيط للمستخدم) */
userTypeEl.addEventListener("change", function() {
    if (this.value === "owner") {
        nameField.classList.add("hidden");
        emailField.classList.add("hidden");
        phoneField.classList.add("hidden");
        passwordField.placeholder = "كلمة سر صاحب المكتب";
    } else {
        nameField.classList.remove("hidden");
        emailField.classList.remove("hidden");
        phoneField.classList.remove("hidden");
        passwordField.placeholder = "كلمة السر";
    }
});

/* عند تحميل الصفحة نتأكد من الحالة الأولية (لو الصفحة رجعت) */
(function initVisibility() {
    if (userTypeEl.value === "owner") {
        nameField.classList.add("hidden");
        emailField.classList.add("hidden");
        phoneField.classList.add("hidden");
        passwordField.placeholder = "كلمة سر صاحب المكتب";
    } else {
        nameField.classList.remove("hidden");
        emailField.classList.remove("hidden");
        phoneField.classList.remove("hidden");
        passwordField.placeholder = "كلمة السر";
    }
})();

/* الحدث الأساسي للفحص والتوجيه */
submitBtn.addEventListener("click", function (e) {
    e.preventDefault();

    const userType = userTypeEl.value;
    const name = nameField.value.trim();
    const email = emailField.value.trim();
    const phone = phoneField.value.trim();
    const password = passwordField.value.trim();

    // باسورد صاحب المكتب (غيّره هنا لو حبيت)
    const ownerPassword = "Acckhaled20";

    // حالة صاحب المكتب: يظهر الباسورد فقط — نتحقق منه
    if (userType === "owner") {
        if (password === "") {
            alert("من فضلك اكتب كلمة سر");
            return;
        }

        if (password !== ownerPassword) {
            alert("كلمة السر غير صحيحة. غير مسموح بالدخول.");
            return;
        }

        // تسجيل محلي اختياري
        localStorage.setItem("user", JSON.stringify({ type: "owner" }));

        // تحويل لصفحة المدير
        window.location.href = "owner.html";
        return;
    }

    // حالة العميل: نتحقق من الحقول كلها
    if (name === "") {
        alert("اكتب اسمك يا باشا.");
        return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        alert("ادخل إيميل صالح.");
        return;
    }

    const phonePattern = /^01[0-2,5][0-9]{8}$/;
    if (!phonePattern.test(phone)) {
        alert("ادخل رقم موبايل مصري صحيح.");
        return;
    }

    if (password.length < 6) {
        alert("كلمة السر لازم تكون 6 أحرف أو أكتر.");
        return;
    }

    // لو كله تمام نحفظ بيانات العميل محلياً (مؤقت)
    localStorage.setItem("user", JSON.stringify({
        type: "client",
        name: name,
        email: email,
        phone: phone
    }));

    // تحويل لصفحة الماركتينج أو الصفحة التالية
    window.location.href = "Markting.html";
});
</script>
</body>
</html>
