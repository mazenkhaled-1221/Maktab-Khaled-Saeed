<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="WhatsApp Image 2026-05-30 at 21.33.11.jpeg" type="image/x-icon">
<title>مكتب خالد سعيد للمحاسبة</title>

<style>
    body {
        font-family: "Tajawal", Arial, sans-serif;
        background-color: #0A2647;
        color: white;
        text-align: center;
        padding: 40px;
        animation: fadeIn 1.4s ease-in-out;
    }

    .container {
        max-width: 420px;
        margin: auto;
        background: rgba(255, 255, 255, 0.08);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 0 12px rgba(0,0,0,0.4);
        animation: fadeUp 1.2s ease;
    }

    .bismillah {
        font-size: 20px;
        margin-bottom: 10px;
        color: #D4AF37;
        font-weight: bold;
    }

    .images {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
    }

    .images img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #D4AF37;
        box-shadow: 0 0 12px rgba(212,175,55,0.5);
        opacity: 0;
        animation: fadeInImage 1.5s forwards;
    }

    .images img:nth-child(2) {
        animation-delay: 0.4s;
    }

    button {
        margin-top: 22px;
        padding: 10px 35px;
        background-color: #D4AF37;
        border: none;
        border-radius: 7px;
        color: #0A2647;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        opacity: 0.85;
    }

    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }

    @keyframes fadeUp {
        from {opacity: 0; transform: translateY(15px);}
        to {opacity: 1; transform: translateY(0);}
    }

    @keyframes fadeInImage {
        from {opacity: 0; transform: scale(0.85);}
        to {opacity: 1; transform: scale(1);}
    }
</style>
</head>
<body>

<div class="container">

    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>

    <h3>
        ﴿يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ ۝ ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَرْضِيَّةً ۝ فَادْخُلِي فِي عِبَادِي ۝ وَادْخُلِي جَنَّتِي﴾
    </h3>
    <h3>
        ارجو الدعاء للأستاذ
        <br>سمير سعيد علي
    </h3>
    <p>بالرحمه و المغفرة و أن يرزقه الله الفردوس الأعلى</p>

    <div class="images">
               <img src="WhatsApp Image 2026-04-25 at 22.14.37.jpeg" alt="">
    </div>

    <button onclick="window.location.href='khaled said.html'">تم</button>
</div>

</body>
</html>
